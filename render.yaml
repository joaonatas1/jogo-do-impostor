databases:
  - name: jogo-do-impostor-db
    databaseName: impostor
    user: impostor
    plan: free
    region: oregon

services:
  - type: web
    name: jogo-do-impostor
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jogo-do-impostor-db
          property: connectionString
